name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: andamio-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npm run build -- --base-href /andamioapp/

      # Sin esto, cualquier link directo a una ruta de Angular (ej. /quotes/preview/8)
      # da 404 de GitHub Pages en vez de dejar que el router de Angular la resuelva.
      # Tiene que copiarse DESPUÉS del build porque index.html ya trae los <script>
      # con el hash correcto — un 404.html estático de antemano no los tendría.
      - name: SPA fallback (404 -> index.html)
        run: |
          cp dist/andamio-client/browser/index.html dist/andamio-client/browser/404.html
          touch dist/andamio-client/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: andamio-client/dist/andamio-client/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
