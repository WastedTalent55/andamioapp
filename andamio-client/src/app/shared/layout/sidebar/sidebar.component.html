<nav class="andamio-topbar">
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="180" height="45" fill="none">
      <g transform="translate(15, 15)">
        <line x1="25" y1="5" x2="5" y2="45" stroke="#FFB800" stroke-width="5" stroke-linecap="square"/>
        <line x1="25" y1="5" x2="45" y2="45" stroke="#FFB800" stroke-width="5" stroke-linecap="square"/>
        <line x1="2" y1="32" x2="48" y2="32" stroke="#FFB800" stroke-width="5" stroke-linecap="square"/>
        <circle cx="14" cy="27" r="2.5" fill="#0A0A0A"/>
        <circle cx="36" cy="27" r="2.5" fill="#0A0A0A"/>
      </g>
      <text x="80" y="52" font-family="'Archivo', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#FAFAFA">ANDAMIO</text>
    </svg>
  </div>

  <ul class="nav-links">
    <li><a routerLink="/dashboard" routerLinkActive="active">
      <lucide-icon [img]="LayoutDashboard" size="18"></lucide-icon>
      <span>DASHBOARD</span></a>
    </li>

    <li><a routerLink="/board" routerLinkActive="active">
      <lucide-icon [img]="Kanban" size="18"></lucide-icon>
      <span>TABLERO</span></a>
    </li>

    <li><a routerLink="/customer" routerLinkActive="active">
      <lucide-icon [img]="Users" size="18"></lucide-icon>
      <span>CLIENTXS</span></a>
    </li>

    <li><a routerLink="/quotes" routerLinkActive="active">
      <lucide-icon [img]="FileText" size="18"></lucide-icon>
      <span>COTIZACIONES</span></a>
    </li>

    <li><a routerLink="/projects" routerLinkActive="active">
      <lucide-icon [img]="HardHat" size="18"></lucide-icon>
      <span>PROYECTOS</span></a>
    </li>
  </ul>

  <div class="topbar-tenant" [class.open]="isAccountMenuOpen">
    <button type="button" class="tenant-tag" (click)="toggleAccountMenu($event)">
      {{ tenantName || 'ANDAMIO' | uppercase }}
      <lucide-icon [img]="ChevronDown" size="14"></lucide-icon>
    </button>

    <div class="account-dropdown" *ngIf="isAccountMenuOpen">
      <a routerLink="/settings" class="account-dropdown-item" (click)="isAccountMenuOpen = false">
        <lucide-icon [img]="Settings" size="16"></lucide-icon>
        Configuración
      </a>
      <button type="button" class="account-dropdown-item danger" (click)="logout()">
        <lucide-icon [img]="LogOut" size="16"></lucide-icon>
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
