<div class="form-container">
  <div class="form-header">
    <h3>{{ isEditMode ? '✏️ EDITAR EVALUACIÓN TÉCNICA' : '📋 AGENDAR NUEVA EVALUACIÓN TÉCNICA' }}</h3>
    <button type="button" class="btn-close" (click)="closeForm()" title="Cancelar">&times;</button>
  </div>
  
  <form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()" class="andamio-form">
    
    <div class="form-row">
      <div class="form-group search-container">
        <label>CLIENTE</label>
        <input 
    type="text" 
    class="form-control" 
    placeholder="Escribe el nombre del cliente..."
    [value]="searchTerm"
    (input)="onSearch($event)"
    (focus)="showResults = true">

  <!-- Lista de resultados (Autocomplete) -->
  <div class="search-results" *ngIf="showResults && filteredCustomers.length > 0">
    <div 
      class="result-item" 
      *ngFor="let customer of filteredCustomers"
      (click)="selectCustomer(customer)">
      {{ customer.first_name }} {{ customer.last_name }}
    </div>
  </div>
  
  <!-- Campo oculto para mantener la validación del customer_id -->
  <input type="hidden" formControlName="customer_id">
      </div>

      <div class="form-group">
        <label>UBICACIÓN DE OBRA</label>
        <select formControlName="address_id" class="form-control">
          <option value="" disabled>-- Selecciona ubicación --</option>
          <option *ngFor="let addr of filteredAddresses" [value]="addr.id">
            {{ addr.full_address || 'Dirección Principal' }}
          </option>
        </select>
        <small class="alert-text" *ngIf="filteredAddresses.length === 0">
          ⚠️ SELECCIONA UN CLIENTE PRIMERO.
        </small>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>FECHA Y HORA DE VISITA</label>
        <input type="datetime-local" formControlName="scheduled_date" class="form-control">
      </div> 

      <div class="form-group">
        <label>COSTO DE EVALUACIÓN (MXN)</label>
        <input type="number" formControlName="evaluation_cost" class="form-control data-number" placeholder="Ej: 1500">
      </div>
    </div>

    <div class="form-group">
      <label>TÍTULO DEL TRABAJO SOLICITADO</label>
      <input 
        type="text" 
        formControlName="requested_work"
        class="form-control highlight-input"
        placeholder="Ej: Tratamiento de humedad en techo de baño"
      >
      <p class="field-hint">Este título aparecerá en la descripción de la cotización final.</p>
    </div>

    <button type="submit" class="btn-andamio full-width" [disabled]="evaluationForm.invalid">
      {{ isEditMode ? 'GUARDAR CAMBIOS' : 'CONFIRMAR Y AGENDAR VISITA' }}
    </button>
  </form>
</div>
