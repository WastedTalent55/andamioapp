<app-page-header
  title="Cotizaciones"
  subtitle="Da seguimiento a cada cotización, desde borrador hasta aceptación."
  buttonLabel="Nueva cotización"
  (onButtonClick)="openStartOptions()">
</app-page-header>

<app-new-quote-modal *ngIf="showNewQuoteModal" (closed)="showNewQuoteModal = false"></app-new-quote-modal>

<div class="quote-kpis">

  <div class="kpi-card">
    <span class="kpi-value">{{ totalCount }}</span>
    <span class="kpi-label">TOTAL</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">{{ enviadasCount }}</span>
    <span class="kpi-label">ENVIADAS</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">{{ aceptadasCount }}</span>
    <span class="kpi-label">ACEPTADAS</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value data-number">${{ montoAceptado | number:'1.0-0' }}</span>
    <span class="kpi-label">MONTO ACEPTADO</span>
  </div>

</div>

<div class="quote-feature-container">

  <div class="search-toolbar">

    <div class="search-box">
      <span class="search-icon"><lucide-icon [img]="Search" size="16"></lucide-icon></span>
      <input
        type="text"
        class="search-input"
        placeholder="Buscar por cliente o folio..."
        (input)="onSearch($event)">
    </div>

  </div>

  <div class="quote-grid" *ngIf="filteredQuotes.length > 0; else emptyState">
    @for (quote of filteredQuotes; track quote.id) {
      <app-quote-card [quote]="quote"></app-quote-card>
    }
  </div>

  <ng-template #emptyState>
    <div class="empty-state card-andamio">
      <p>Todavía no hay cotizaciones. Se crean desde el detalle de una evaluación.</p>
    </div>
  </ng-template>

</div>
