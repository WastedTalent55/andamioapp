<div class="form-container">
  <div class="form-header">
    <h3>🏗️ INICIAR PROYECTO</h3>
    <button type="button" class="btn-close" (click)="closeForm()">&times;</button>
  </div>

  <div class="quote-context card-andamio" *ngIf="quoteData">
    <span class="control-description">
      Cliente: <strong>{{ quoteData.customer_name }}</strong> ·
      Folio #{{ quoteData.quote_folio }} ·
      Total: ${{ quoteData.total_amount | number:'1.2-2' }}
    </span>
  </div>

  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="andamio-form">

    <div class="form-group">
      <label>NOMBRE DEL PROYECTO</label>
      <input type="text" formControlName="project_name" class="form-control" placeholder="Ej: Remodelación cocina — Casa Pérez">
    </div>

    <div class="grid-row">
      <div class="form-group">
        <label>FECHA DE INICIO</label>
        <input type="date" formControlName="start_date" class="form-control">
      </div>
      <div class="form-group">
        <label>FECHA ESTIMADA DE ENTREGA</label>
        <input type="date" formControlName="estimated_end_date" class="form-control">
      </div>
    </div>

    <div class="form-group">
      <label>NOTAS INICIALES (OPCIONAL)</label>
      <textarea formControlName="notes" class="form-control" rows="3" placeholder="Cualquier detalle para arrancar el proyecto"></textarea>
    </div>

    <button type="submit" class="btn-andamio full-width" [disabled]="projectForm.invalid || submitting">
      {{ submitting ? 'CREANDO PROYECTO...' : 'CREAR PROYECTO Y ACEPTAR COTIZACIÓN' }}
    </button>
  </form>
</div>
