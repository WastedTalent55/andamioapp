<app-page-header title="Tablero de Proyectos"></app-page-header>

<div class="kanban-container"> 
  <div class="kanban-board"> 
    <app-board-column 
      title="EVALUACIONES" 
      type="evaluations"
      [items]="columns.evaluations">
    </app-board-column>

    <app-board-column 
      title="EN COTIZACIÓN" 
      type="quoting"
      [items]="columns.quoting">
    </app-board-column>

    <app-board-column 
      title="PROYECTOS ACTIVOS" 
      type="active"
      [items]="columns.active">
    </app-board-column>

    <app-board-column 
      title="FINALIZADOS" 
      type="finished"
      [items]="columns.finished">
    </app-board-column>
  </div>
</div>
