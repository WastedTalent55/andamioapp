<div class="content-container">
  <div class="tenant-page">
  <div class="tenant-header">
    <h1>Configuración de Empresa</h1>
    <p>Estos datos aparecerán en tus cotizaciones profesionales.</p>
  </div>

  <form [formGroup]="tenantForm" (ngSubmit)="saveTenant()" class="card-andamio">
    
    <div class="branding-header-grid">
      <div class="logo-upload-section" [class.has-logo]="logoPreview">
      <h3 class="section-title">Logo de Empresa</h3>
      
      <div class="upload-container">
        <div class="logo-preview-box" *ngIf="logoPreview">
          <img [src]="logoPreview" alt="Vista previa del logo">
        </div>

        <div class="upload-controls">
          <label for="logo" class="btn-andamio-outline">
            <span><lucide-icon [img]="Camera" size="16"></lucide-icon> SELECCIONAR LOGOTIPO</span>
            <input id="logo" type="file" (change)="onFileSelected($event)" accept="image/*" hidden>
          </label>
          
          <div class="upload-confirmation" *ngIf="logoPreview">
            <span class="success-text"><lucide-icon [img]="CircleCheck" size="16"></lucide-icon> ARCHIVO LISTO PARA PROCESAR</span>
          </div>
          
          <p class="tenant-tag">Formatos: PNG, JPG (Se recomienda cuadrado)</p>
        </div>
      </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="company_name">Nombre de tu proyecto</label>
        <input type="text" formControlName="company_name" placeholder="Tu marca">
      </div>

      <div class="form-group">
        <label for="owner_name">Nombre del Admin de esta cuenta</label>
        <input type="text" formControlName="owner_name">
      </div>

      <!-- Datos de Contacto -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email de Negocio</label>
          <input type="email" formControlName="email">
        </div>
        <div class="form-group">
          <label for="phone">Teléfono / WhatsApp</label>
          <input type="text" formControlName="phone">
        </div>
      </div>

      <div class="form-group">
        <label for="address">Dirección Física</label>
        <input type="text" formControlName="address">

        <label class="checkbox-inline">
          <input type="checkbox" formControlName="no_physical_address" (change)="onNoPhysicalAddressChange($event)">
          Sin dirección física
        </label>
      </div>

      <div class="form-group">
        <label for="social_media">Redes sociales</label>
        <input type="text" formControlName="social_media" placeholder="Ej: Instagram @tuempresa / facebook.com/tuempresa">
        <p class="tenant-tag">Se muestra en tus cotizaciones solo si lo llenas.</p>
      </div>

      <!-- Datos Bancarios -->
      <h3 class="section-title">Información de Pago</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="bank_name">Banco</label>
          <input type="text" formControlName="bank_name" placeholder="Ej: BBVA">
        </div>
        <div class="form-group">
          <label for="bank_account">Número de Cuenta</label>
          <input type="text" formControlName="bank_account" class="data-number">
        </div>
        <div class="form-group">
          <label for="bank_clabe">CLABE Interbancaria (18 dígitos)</label>
          <input type="text" formControlName="bank_clabe" class="data-number">
        </div>
      </div> 
      <!-- Términos y Condiciones -->
      <h3 class="section-title">Términos y Condiciones</h3>  
      <div class="form-group">
        <label for="terms_conditions">Este texto aparecerá al final de cada cotización</label>
        <textarea
          id="terms_conditions"
          formControlName="terms_conditions"
          rows="5"
          placeholder="Ej: Cotización válida por 15 días. Anticipo del 50% para iniciar el proyecto..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-andamio">
        ACTUALIZAR INFRAESTRUCTURA
      </button>
    </div>
  </form>
  </div>
</div>
