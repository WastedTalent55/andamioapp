<app-page-header
  title="Dashboard">
</app-page-header>

<div class="dashboard-layout">

  <!-- Bienvenida -->
  <section class="hero-section">

    <h2>Buenos días, {{ userName }}</h2>

    <p>
      Aquí tienes un resumen del estado actual de tu operación.
    </p>

  </section>

  <!-- Indicadores -->
  <section class="kpi-grid">
    <div class="widgets-grid">

    <app-kpi-card
        icon="👤"
        title="Clientes"
        [value]="totalClientes">
    </app-kpi-card>

    <app-kpi-card
        icon="📋"
        title="Evaluaciones"
        [value]="6">
    </app-kpi-card>

    <app-kpi-card
        icon="📝"
        title="Cotizaciones"
        [value]="3">
    </app-kpi-card>

    <app-kpi-card
        icon="🏗️"
        title="Proyectos"
        [value]="12">
    </app-kpi-card>

</div>

  </section>

  <!-- Actividad -->
  <section class="activity-grid">

  </section>

</div>
