<app-page-header
  title="Dashboard">
</app-page-header>

<div class="dashboard-layout">

  <!-- Bienvenida -->
  <section class="hero-section">

    <div class="hero-info">

      <div>
        <span class="hero-tag">
          CONTROL OPERATIVO
        </span>

        <h2>
          Buenos días, {{ userName }} !
        </h2>

        <p>
          Aquí tienes una vista general de tu operación.
          Revisa lo que está pendiente y continúa donde lo dejaste.
        </p>

      </div>

      <button class="btn-andamio" (click)="goToBoard()">
        Ver tablero
      </button>

    </div>

  </section>

  <!-- Indicadores -->
  <section class="kpi-grid">
    <app-kpi-card
        [icon]="Users"
        title="Clientes"
        [value]="totalClientes"
        [subtitle]="'+' + clientesNuevos + ' este mes'">
    </app-kpi-card>
 
    <app-kpi-card
        [icon]="ClipboardCheck"
        title="Evaluaciones"
        [value]="totalEvaluaciones"
        [subtitle]="evaluacionesPendientes + ' pendientes'">
    </app-kpi-card>

    <app-kpi-card
        [icon]="FileText"
        title="Cotizaciones"
        [value]="totalCotizaciones"
        [subtitle]="cotizacionesEnviadas + ' enviadas'">
    </app-kpi-card>

    <app-kpi-card
        [icon]="HardHat"
        title="Proyectos"
        [value]="totalProyectos"
        [subtitle]="proyectosActivos + ' activos'">
    </app-kpi-card>
  </section>

  <!-- Actividad -->
   <section class="activity-grid">

    <div class="card-andamio">

    <h3 class="section-title">
      <lucide-icon 
        [img]="Calendar"
        size="20">
      </lucide-icon>
      Actividad reciente
    </h3>

    <div class="activity-list">

      <div class="activity-item" *ngIf="loadingActivity">
        <p>Cargando...</p>
      </div>

      <div class="activity-item" *ngIf="!loadingActivity && recentActivity.length === 0">
        <p>Todavía no hay actividad registrada.</p>
      </div>

      <div class="activity-item" *ngFor="let item of recentActivity">

        <span class="activity-dot" [ngClass]="item.color"></span>

        <div>

          <strong>{{ item.title }}</strong>

          <p>{{ item.subtitle }}</p>

        </div>

      </div>

    </div>

  </div>

  <div class="card-andamio">

    <h3 class="section-title">
      <lucide-icon 
        [img]="Zap"
        size="20">
      </lucide-icon>
      Acciones rápidas
    </h3>

    <div class="quick-actions">

      <button class="btn-andamio" (click)="createCustomer()">
        Nuevo Cliente
      </button>

      <button class="btn-andamio" (click)="createEvaluation()">
        Nueva Evaluación
      </button>

      <button class="btn-andamio" (click)="createQuote()">
        Nueva Cotización
      </button>

    </div>

  </div>

  </section>

</div>

<app-new-quote-modal *ngIf="showNewQuoteModal" (closed)="showNewQuoteModal = false"></app-new-quote-modal>
