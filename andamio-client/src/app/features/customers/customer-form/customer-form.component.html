<div class="form-container">
  <div class="form-header">
    <h3>
      <lucide-icon [img]="isEditMode ? Pencil : User" size="20"></lucide-icon>
      {{ isEditMode ? 'EDITAR CLIENT&#64;' : 'NUEVO CLIENT&#64;' }}
    </h3>
    <button type="button" class="btn-close" (click)="closeForm()">
      <lucide-icon [img]="X" size="20"></lucide-icon>
    </button>
  </div>

  <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="andamio-form">
        <div class="grid-row">
      <div class="form-group">
        <label>NOMBRE(S)</label>
        <input type="text" formControlName="first_name" class="form-control" placeholder="Ej: Paquita">
      </div>
      <div class="form-group">
        <label>APELLIDO(S)</label>
        <input type="text" formControlName="last_name" class="form-control" placeholder="Ej: Salas">
      </div>
    </div>

    <div class="form-group">
      <label>TELÉFONO DE CONTACTO</label>
      <input type="text" formControlName="phone" class="form-control" placeholder="55 1234 5678">
    </div>

    <div class="form-group">
      <label>DIRECCIÓN PRINCIPAL (OBRA/CASA)</label>

      <app-address-autocomplete
        *ngIf="!manualAddressMode"
        (addressSelected)="onAddressSelected($event)">
      </app-address-autocomplete>

      <div class="manual-address-block" *ngIf="manualAddressMode">
        <input type="text" formControlName="address" class="form-control" placeholder="Dirección completa: calle, número, colonia, ciudad, CP">
      </div>

      <button type="button" class="btn-link-toggle" (click)="toggleManualAddress()">
        <lucide-icon [img]="manualAddressMode ? MapPin : Pencil" size="14"></lucide-icon>
        {{ manualAddressMode
          ? 'Usar buscador de Google Maps'
          : '¿No puedes usar el buscador? Ingresa la dirección manualmente' }}
      </button>
    </div>

    <button type="submit" class="btn-andamio full-width" [disabled]="customerForm.invalid || submitting">
      {{ submitting ? 'GUARDANDO...' : (isEditMode ? 'GUARDAR CAMBIOS' : 'GUARDAR Y DAR DE ALTA') }}
    </button>
  </form>
</div>
