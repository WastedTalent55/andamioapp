<div class="form-container">
  <div class="form-header">
    <h3>{{ isEditMode ? '✏️ EDITAR CLIENT&#64;' : '👤 NUEVO CLIENT&#64;' }}</h3>
    <button type="button" class="btn-close" (click)="closeForm()">&times;</button>
  </div>

  <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="andamio-form">
        <div class="grid-row">
      <div class="form-group">
        <label>NOMBRE(S)</label>
        <input type="text" formControlName="first_name" class="form-control" placeholder="Ej: Paquita">
      </div>
      <div class="form-group">
        <label>APELLIDO(S)</label>
        <input type="text" formControlName="last_name" class="form-control" placeholder="Ej: Salas">
      </div>
    </div>

    <div class="form-group">
      <label>TELÉFONO DE CONTACTO</label>
      <input type="text" formControlName="phone" class="form-control" placeholder="55 1234 5678">
    </div>

    <div class="form-group">
      <label>DIRECCIÓN PRINCIPAL (OBRA/CASA)</label>

      <app-address-autocomplete
        *ngIf="!manualAddressMode"
        (addressSelected)="onAddressSelected($event)">
      </app-address-autocomplete>

      <div class="manual-address-block" *ngIf="manualAddressMode">
        <input type="text" formControlName="address" class="form-control" placeholder="Calle, número, colonia">

        <div class="grid-row">
          <input type="text" formControlName="city" class="form-control" placeholder="Ciudad">
          <input type="text" formControlName="state" class="form-control" placeholder="Estado">
        </div>

        <div class="grid-row">
          <input type="text" formControlName="postal_code" class="form-control" placeholder="Código postal">
          <input type="text" formControlName="country" class="form-control" placeholder="País">
        </div>
      </div>

      <button type="button" class="btn-link-toggle" (click)="toggleManualAddress()">
        {{ manualAddressMode
          ? '📍 Usar buscador de Google Maps'
          : '✏️ ¿No puedes usar el buscador? Ingresa la dirección manualmente' }}
      </button>
    </div>

    <button type="submit" class="btn-andamio full-width" [disabled]="customerForm.invalid">
      {{ isEditMode ? 'GUARDAR CAMBIOS' : 'GUARDAR Y DAR DE ALTA' }}
    </button>
  </form>
</div>
