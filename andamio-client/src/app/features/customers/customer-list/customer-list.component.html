<app-page-header
  [title]="pickForQuote ? 'Elige un cliente para cotizar' : 'Clientes'"
  [subtitle]="pickForQuote ? 'Busca al cliente para el que quieres crear la cotización directa. Si no existe, créalo desde aquí.' : 'Administra tus relaciones de trabajo y da seguimiento a cada proyecto.'"
  buttonLabel="Nuevo cliente"
  (onButtonClick)="navegarANuevoCliente()">
</app-page-header>

<div class="client-kpis" *ngIf="!pickForQuote">

  <div class="kpi-card">
    <span class="kpi-value">
      {{ customers.length }}
    </span>

    <span class="kpi-label">
      CLIENTES
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      {{ activosCount }}
    </span>

    <span class="kpi-label">
      ACTIVOS
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      {{ conEvaluacionCount }}
    </span>

    <span class="kpi-label">
      CON EVALUACIÓN
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      {{ nuevosEsteMes }}
    </span>

    <span class="kpi-label">
      NUEVOS
    </span>
  </div>

</div>

<div class="client-feature-container">
  <div class="search-toolbar">

    <div class="search-box">

        <span class="search-icon">

            <lucide-icon [img]="Search" size="16"></lucide-icon>

        </span>

        <input
            type="text"
            class="search-input"
            placeholder="Buscar cliente..."
            (input)="onSearch($event)">

    </div>

    <button class="toolbar-filter">

        Más recientes

        ▼

    </button>

  </div>
  
  <div class="client-grid">
  @for (customer of filteredCustomers; track customer.id) {
    <app-customer-card
      [customer]="customer"
      [pickMode]="pickForQuote"
      (picked)="onCustomerPicked($event)"
      (deleted)="onCustomerDeleted($event)">
    </app-customer-card>
  }
  </div>
</div>
