<app-page-header
  title="Clientes"
  subtitle="Administra tus relaciones de trabajo y da seguimiento a cada proyecto."
  buttonLabel="Nuevo cliente"
  (onButtonClick)="navegarANuevoCliente()">
</app-page-header>

<div class="client-kpis">

  <div class="kpi-card">
    <span class="kpi-value">
      {{ customers.length }}
    </span>

    <span class="kpi-label">
      CLIENTES
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      0
    </span>

    <span class="kpi-label">
      ACTIVOS
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      0
    </span>

    <span class="kpi-label">
      CON EVALUACIÓN
    </span>
  </div>

  <div class="kpi-card">
    <span class="kpi-value">
      0
    </span>

    <span class="kpi-label">
      NUEVOS
    </span>
  </div>

</div>

<div class="client-feature-container">
  <div class="search-toolbar">

    <div class="search-box">

        <span class="search-icon">

            🔍

        </span>

        <input
            type="text"
            class="search-input"
            placeholder="Buscar cliente..."
            (input)="onSearch($event)">

    </div>

    <button class="toolbar-filter">

        Más recientes

        ▼

    </button>

  </div>
  
  <div class="client-grid">
  @for (customer of filteredCustomers; track customer.id) {
    <app-customer-card
      [customer]="customer">
    </app-customer-card>
  }
  </div>
</div>
